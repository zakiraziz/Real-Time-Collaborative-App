services:
  - type: web
    name: real-time-collab-app
    runtime: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server.js
    disk:
      name: collab-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: /data/database.sqlite

# The SQLite file is stored on the persistent disk configured above.